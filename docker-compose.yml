# =============================================================================
# NexChat — Docker Compose (Full Stack Orchestration)
#
# This file defines ALL services in the NexChat system.
# Services are added progressively across phases:
#   Phase 1: postgres + java-service
#   Phase 3: + go-service
#   Phase 5: + redis + nginx
#
# Usage:
#   Start all:    docker compose up -d
#   Start one:    docker compose up -d postgres
#   Logs:         docker compose logs -f java-service
#   Stop all:     docker compose down
#   Wipe volumes: docker compose down -v  (destroys all data)
# =============================================================================

version: '3.9'

services:

  # ===========================================================================
  # MongoDB — NoSQL Database
  # ===========================================================================
  mongodb:
    image: mongo:7
    container_name: nexchat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nexchat-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # Redis — Pub/Sub + Presence Cache (added in Phase 5, stubbed now)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: nexchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexchat-network
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================================================
  # Node.js Backend Service — Auth + REST API
  # ===========================================================================
  node-backend:
    build:
      context: ./backend
      dockerfile: ../docker/node-service.Dockerfile
    container_name: nexchat-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET:-nexchat-super-secret-key-replace-in-production-minimum-32-bytes}
      # Internal service token
      INTERNAL_SECRET: ${INTERNAL_SECRET:-nexchat-internal-dev-secret}
      # Application settings
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexchat-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # Go WebSocket Service — Real-time relay + Redis Pub/Sub
  # ===========================================================================
  go-service:
    build:
      context: ./go-service
      dockerfile: ../docker/go-service.Dockerfile
    container_name: nexchat-go
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-nexchat-super-secret-key-replace-in-production-minimum-32-bytes}
      REDIS_URL: ${REDIS_URL}
      MONGO_URI: ${MONGODB_URI}
      NODE_SERVICE_URL: http://node-backend:8080
      INTERNAL_SECRET: ${INTERNAL_SECRET:-nexchat-internal-dev-secret}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      node-backend:
        condition: service_healthy
    networks:
      - nexchat-network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  # ===========================================================================
  # Nginx Reverse Proxy (added in Phase 5)
  # ===========================================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: nexchat-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - java-service
  #     - go-service
  #   networks:
  #     - nexchat-network

  # =============================================================================
  # Networks
  # =============================================================================
networks:
  nexchat-network:
    driver: bridge
    # Bridge network: containers on the same network can communicate by
    # container name (e.g., postgres, java-service). Perfect for a single-host setup.
    # For multi-host (Kubernetes, Docker Swarm), use overlay networks.

    # =============================================================================
    # Volumes
    # =============================================================================
volumes:
  mongodb_data:
    driver: local
    # Named volumes persist beyond container lifecycle.
    # `docker compose down` removes containers but NOT volumes.
    # `docker compose down -v` removes both.
  redis_data:
    driver: local
